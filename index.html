<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Workspace</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>📝 QuickNotes Pro</h1>
        
        <p id="status"></p>

        <!-- Task 2: Create Note Workspace Form -->
        <section class="card">
            <h2>Create New Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note Title:</label>
                    <input type="text" id="title-input" placeholder="Enter note title..." required>
                </div>
                <div class="form-group">
                    <label for="body-input">Note Content:</label>
                    <textarea id="body-input" placeholder="Type your notes here..."></textarea>
                </div>
                <button type="submit" id="submit-btn">Save Note</button>
            </form>
        </section>

        <!-- Task 1: Notes List Index Explorer -->
        <section class="card">
            <div class="card-header">
                <h2>Cloud Repository</h2>
                <button id="load-btn">Load notes</button>
            </div>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
